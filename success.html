<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Application Successful - GCash</title>
  <style>
    :root {
      --primary: #00b14f;
      --primary-dark: #0d8d42;
      --primary-soft: #dff9eb;
      --ink: #1c1c1e;
      --muted: #6b7280;
      --line: #e8ebef;
      --shadow: 0 22px 50px rgba(15, 23, 42, 0.12);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      font-family: Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(180deg, #edf7f2 0%, #f6f7fb 100%);
      color: var(--ink);
    }

    body {
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .phone {
      position: relative;
      width: 100%;
      max-width: 420px;
      min-height: 820px;
      background: linear-gradient(180deg, #fbfcff 0%, #f6f9fd 100%);
      border-radius: 34px;
      border: 1px solid rgba(17, 24, 39, 0.05);
      box-shadow: var(--shadow);
      overflow: hidden;
      padding: 26px 20px 120px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-mark {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--primary) 0%, #22c55e 100%);
      position: relative;
      box-shadow: 0 10px 18px rgba(0, 177, 79, 0.25);
    }

    .brand-mark::before {
      content: "G";
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: white;
      font-weight: 900;
      font-size: 20px;
    }

    .brand-text {
      font-size: 18px;
      font-weight: 900;
      letter-spacing: -0.04em;
    }

    .chip {
      background: var(--primary-soft);
      color: var(--primary-dark);
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .progress-bar {
      width: 100%;
      height: 5px;
      background: var(--line);
      border-radius: 999px;
      margin-bottom: 24px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), #22c55e);
      transition: width 0.3s ease;
    }

    .success-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding-top: 30px;
    }

    .success-icon {
      width: 80px;
      height: 80px;
      background: var(--primary-soft);
      border: 3px solid var(--primary);
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 48px;
      margin-bottom: 20px;
    }

    .success-title {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: -0.06em;
      margin-bottom: 8px;
    }

    .success-sub {
      font-size: 15px;
      color: var(--muted);
      margin-bottom: 28px;
    }

    .success-details {
      width: 100%;
      background: rgba(255,255,255,0.8);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 20px;
      text-align: left;
    }

    .success-detail-row {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid var(--line);
      font-size: 13px;
    }

    .success-detail-row:last-child {
      border-bottom: none;
    }

    .success-detail-label {
      color: var(--muted);
      font-weight: 700;
    }

    .success-detail-value {
      font-weight: 900;
      color: var(--primary-dark);
    }

    .review-status {
      background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
      border: 1px solid rgba(217, 119, 6, 0.2);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 20px;
      text-align: center;
      width: 100%;
    }

    .review-status-title {
      font-size: 12px;
      text-transform: uppercase;
      color: #92400e;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .review-status-time {
      font-size: 16px;
      font-weight: 900;
      color: #b45309;
    }

    button.primary {
      width: 100%;
      border: none;
      background: linear-gradient(135deg, var(--primary) 0%, #13a95b 100%);
      color: #fff;
      height: 58px;
      border-radius: 18px;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 16px 28px rgba(0, 177, 79, 0.24);
      transition: 0.2s ease;
      margin-bottom: 12px;
    }

    button.primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 20px 36px rgba(0, 177, 79, 0.3);
    }

    .footer {
      position: absolute;
      left: 20px;
      right: 20px;
      bottom: 12px;
      text-align: center;
      color: var(--muted);
      font-size: 11px;
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="topbar">
      <div class="brand">
        <div class="brand-mark"></div>
        <div class="brand-text">GCash</div>
      </div>
      <span class="chip">Success</span>
    </div>

    <div class="progress-bar">
      <div class="progress-fill" style="width: 100%;"></div>
    </div>

    <div class="success-container">
      <div class="success-icon">✓</div>
      <h1 class="success-title">Congratulations!</h1>
      <p class="success-sub">Your loan application has been submitted successfully.</p>

      <div class="success-details">
        <div class="success-detail-row">
          <span class="success-detail-label">Name</span>
          <span class="success-detail-value" id="successName">Juan Dela Cruz</span>
        </div>
        <div class="success-detail-row">
          <span class="success-detail-label">Phone Number</span>
          <span class="success-detail-value" id="successPhone">0917 123 4567</span>
        </div>
        <div class="success-detail-row">
          <span class="success-detail-label">Loan Amount</span>
          <span class="success-detail-value" id="successAmount">₱10,000</span>
        </div>
        <div class="success-detail-row">
          <span class="success-detail-label">Loan Period</span>
          <span class="success-detail-value" id="successPeriod">12 months</span>
        </div>
        <div class="success-detail-row">
          <span class="success-detail-label">Interest</span>
          <span class="success-detail-value">4% per year</span>
        </div>
      </div>

      <div class="review-status">
        <div class="review-status-title">Review Status</div>
        <div class="review-status-time">Within 12 hours</div>
      </div>
    </div>

    <button class="primary" onclick="applyAgain()">Apply for Another Loan</button>

    <div class="footer">© 2026 GCash. All rights reserved.</div>
  </div>

  <script>
    function loadSuccessData() {
      const applicantData = JSON.parse(sessionStorage.getItem('applicantData'));
      const loanData = JSON.parse(sessionStorage.getItem('loanData'));

      if (applicantData) {
        document.getElementById('successName').textContent = applicantData.fullname;
        document.getElementById('successPhone').textContent = applicantData.phone;
      }

      if (loanData) {
        document.getElementById('successAmount').textContent = '₱' + loanData.amount.toLocaleString();
        document.getElementById('successPeriod').textContent = loanData.period + ' months';
      }
    }

    function applyAgain() {
      sessionStorage.clear();
      window.location.href = 'loan.html';
    }

    loadSuccessData();
  </script>
</body>
</html>
