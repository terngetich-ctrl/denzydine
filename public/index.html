<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GCash Loan Application</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .calculator-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-top: 30px;
            border-left: 4px solid #667eea;
        }

        .calculator-section h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 16px;
        }

        .calc-result {
            background: white;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .calc-result label {
            margin: 0;
            color: #666;
            font-weight: 400;
        }

        .calc-result .value {
            font-weight: bold;
            color: #667eea;
            font-size: 18px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 20px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-secondary {
            background: #6c757d;
        }

        .btn-secondary:hover {
            box-shadow: 0 5px 20px rgba(108, 117, 125, 0.4);
        }

        @media (max-width: 600px) {
            .container {
                padding: 25px;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .button-group {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💰 GCash Loan Application</h1>
        <p class="subtitle">Quick and Easy Loan Processing</p>

        <form id="loanForm">
            <!-- Personal Information -->
            <div class="form-group">
                <label for="fullName">Full Name *</label>
                <input type="text" id="fullName" name="fullName" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="email">Email Address *</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="phone">Phone Number *</label>
                    <input type="tel" id="phone" name="phone" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="dob">Date of Birth *</label>
                    <input type="date" id="dob" name="dob" required>
                </div>
                <div class="form-group">
                    <label for="gender">Gender *</label>
                    <select id="gender" name="gender" required>
                        <option value="">Select Gender</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                        <option value="other">Other</option>
                    </select>
                </div>
            </div>

            <!-- Address Information -->
            <div class="form-group">
                <label for="address">Address *</label>
                <input type="text" id="address" name="address" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="city">City *</label>
                    <input type="text" id="city" name="city" required>
                </div>
                <div class="form-group">
                    <label for="province">Province *</label>
                    <input type="text" id="province" name="province" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="zipcode">Zip Code *</label>
                    <input type="text" id="zipcode" name="zipcode" required>
                </div>
                <div class="form-group">
                    <label for="country">Country *</label>
                    <input type="text" id="country" name="country" value="Philippines" required>
                </div>
            </div>

            <!-- Loan Information -->
            <div class="form-group">
                <label for="loanAmount">Loan Amount (₱) *</label>
                <input type="number" id="loanAmount" name="loanAmount" min="1000" step="100" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="loanTerm">Loan Term (Months) *</label>
                    <input type="number" id="loanTerm" name="loanTerm" min="1" max="60" required>
                </div>
                <div class="form-group">
                    <label for="interestRate">Interest Rate (%) *</label>
                    <input type="number" id="interestRate" name="interestRate" min="0" step="0.1" value="12" required>
                </div>
            </div>

            <div class="form-group">
                <label for="loanPurpose">Purpose of Loan *</label>
                <select id="loanPurpose" name="loanPurpose" required>
                    <option value="">Select Purpose</option>
                    <option value="business">Business</option>
                    <option value="personal">Personal</option>
                    <option value="education">Education</option>
                    <option value="medical">Medical</option>
                    <option value="emergency">Emergency</option>
                    <option value="other">Other</option>
                </select>
            </div>

            <!-- Loan Calculator -->
            <div class="calculator-section">
                <h3>Loan Calculator</h3>
                <div class="calc-result">
                    <label>Monthly Payment:</label>
                    <span class="value">₱<span id="monthlyPayment">0.00</span></span>
                </div>
                <div class="calc-result">
                    <label>Total Interest:</label>
                    <span class="value">₱<span id="totalInterest">0.00</span></span>
                </div>
                <div class="calc-result">
                    <label>Total Amount to Pay:</label>
                    <span class="value">₱<span id="totalAmount">0.00</span></span>
                </div>
            </div>

            <!-- Employment Information -->
            <div class="form-group">
                <label for="employment">Employment Status *</label>
                <select id="employment" name="employment" required>
                    <option value="">Select Status</option>
                    <option value="employed">Employed</option>
                    <option value="self-employed">Self-Employed</option>
                    <option value="unemployed">Unemployed</option>
                    <option value="student">Student</option>
                    <option value="retired">Retired</option>
                </select>
            </div>

            <div class="form-group">
                <label for="monthlyIncome">Monthly Income (₱) *</label>
                <input type="number" id="monthlyIncome" name="monthlyIncome" min="0" step="100" required>
            </div>

            <!-- Additional Information -->
            <div class="form-group">
                <label for="remarks">Additional Remarks</label>
                <textarea id="remarks" name="remarks" rows="4" placeholder="Any additional information..."></textarea>
            </div>

            <!-- Buttons -->
            <div class="button-group">
                <button type="reset" class="btn-secondary">Clear Form</button>
                <button type="submit">Submit Application</button>
            </div>
        </form>
    </div>

    <script>
        // Loan Calculator Function
        function calculateLoan() {
            const loanAmount = parseFloat(document.getElementById('loanAmount').value) || 0;
            const loanTerm = parseFloat(document.getElementById('loanTerm').value) || 0;
            const interestRate = parseFloat(document.getElementById('interestRate').value) || 0;

            if (loanAmount > 0 && loanTerm > 0) {
                const monthlyRate = interestRate / 100 / 12;
                let monthlyPayment;

                if (monthlyRate === 0) {
                    monthlyPayment = loanAmount / loanTerm;
                } else {
                    monthlyPayment = (loanAmount * monthlyRate * Math.pow(1 + monthlyRate, loanTerm)) / 
                                   (Math.pow(1 + monthlyRate, loanTerm) - 1);
                }

                const totalAmount = monthlyPayment * loanTerm;
                const totalInterest = totalAmount - loanAmount;

                document.getElementById('monthlyPayment').textContent = monthlyPayment.toFixed(2);
                document.getElementById('totalInterest').textContent = totalInterest.toFixed(2);
                document.getElementById('totalAmount').textContent = totalAmount.toFixed(2);
            } else {
                document.getElementById('monthlyPayment').textContent = '0.00';
                document.getElementById('totalInterest').textContent = '0.00';
                document.getElementById('totalAmount').textContent = '0.00';
            }
        }

        // Event listeners for calculator
        document.getElementById('loanAmount').addEventListener('input', calculateLoan);
        document.getElementById('loanTerm').addEventListener('input', calculateLoan);
        document.getElementById('interestRate').addEventListener('input', calculateLoan);

        // Form submission
        document.getElementById('loanForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Thank you for submitting your loan application! We will review your information and contact you soon.');
            // Here you would typically send the data to a server
        });
    </script>
</body>
</html>
